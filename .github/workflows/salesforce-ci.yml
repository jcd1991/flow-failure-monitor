name: Salesforce CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SF_ACCESS_TOKEN: ${{ secrets.SF_ACCESS_TOKEN }}
      SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Salesforce project shape
        shell: bash
        run: |
          test -f sfdx-project.json
          test -d force-app
          test -f force-app/main/default/classes/FFM_FlowFailureMonitorTest.cls
          echo "Salesforce source layout is present."

      - name: Install Salesforce CLI for org validation
        if: ${{ env.SF_ACCESS_TOKEN != '' && env.SF_INSTANCE_URL != '' }}
        run: npm install --global @salesforce/cli

      - name: Authenticate CI org
        if: ${{ env.SF_ACCESS_TOKEN != '' && env.SF_INSTANCE_URL != '' }}
        run: echo "$SF_ACCESS_TOKEN" | sf org login access-token --alias ci --instance-url "$SF_INSTANCE_URL"

      - name: Validate package metadata in CI org
        if: ${{ env.SF_ACCESS_TOKEN != '' && env.SF_INSTANCE_URL != '' }}
        run: sf project deploy start --source-dir force-app --target-org ci --dry-run --test-level RunLocalTests --wait 30

      - name: Explain skipped org validation
        if: ${{ env.SF_ACCESS_TOKEN == '' || env.SF_INSTANCE_URL == '' }}
        run: echo "::notice::Org validation skipped because SF_ACCESS_TOKEN and/or SF_INSTANCE_URL is not configured."

      - name: Run MCP build and dependency audit
        working-directory: flow-failure-monitor-mcp
        run: |
          npm ci
          npm run build
          npm audit --omit=dev --audit-level=high
